appId: com.productlifecycle.os
productName: Product Lifecycle OS
copyright: Product Lifecycle OS

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

asar: true
npmRebuild: false
compression: normal

win:
  icon: build/icon.png
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: Product-Lifecycle-OS-${version}-portable.exe
  unpackDirName: ProductLifecycleOS

nsis:
  artifactName: Product-Lifecycle-OS-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
